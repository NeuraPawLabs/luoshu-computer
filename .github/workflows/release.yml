name: Computer signed release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag, such as v0.1.0
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: computer-release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false
jobs:
  publish:
    if: github.event_name == 'push' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.tag || github.ref_name }}
          fetch-depth: 0
          persist-credentials: false
      - name: Require a release commit from main
        run: git merge-base --is-ancestor HEAD origin/main
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.17.1
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - name: Prepare and verify native systemd runtime
        run: |
          runtime_dir="/run/user/$(id -u)"
          sudo loginctl enable-linger "$(id -un)"
          sudo systemctl start "user@$(id -u).service"
          export XDG_RUNTIME_DIR="$runtime_dir"
          export DBUS_SESSION_BUS_ADDRESS="unix:path=$runtime_dir/bus"
          printf 'XDG_RUNTIME_DIR=%s\n' "$XDG_RUNTIME_DIR" >> "$GITHUB_ENV"
          printf 'DBUS_SESSION_BUS_ADDRESS=%s\n' "$DBUS_SESSION_BUS_ADDRESS" >> "$GITHUB_ENV"
          test "$(stat -fc %T /sys/fs/cgroup)" = cgroup2fs
          node --input-type=module -e "await (await import('./dist/lib/engines/native-systemd-supervisor.js')).assertSystemdUserAvailable()"
          systemd-run --user --quiet --pipe --wait --collect --service-type=exec --expand-environment=no /usr/bin/env -i /bin/true
      - run: npm run lint
      - run: npm test
      - run: npm run package
      - run: npm run test:package
      - name: Prepare the signed release
        env:
          LUOSHU_RELEASE_SIGNING_KEY: ${{ secrets.LUOSHU_RELEASE_SIGNING_KEY }}
        run: npm run release:prepare:signed
      - name: Publish verified release assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: node scripts/publish-computer-release.mjs --bundle dist/release-bundle
