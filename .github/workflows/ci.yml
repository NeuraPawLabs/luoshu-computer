name: Computer CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: computer-ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.17.1
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - name: Prepare and verify native systemd runtime
        run: |
          runtime_dir="/run/user/$(id -u)"
          sudo loginctl enable-linger "$(id -un)"
          sudo systemctl start "user@$(id -u).service"
          export XDG_RUNTIME_DIR="$runtime_dir"
          export DBUS_SESSION_BUS_ADDRESS="unix:path=$runtime_dir/bus"
          printf 'XDG_RUNTIME_DIR=%s\n' "$XDG_RUNTIME_DIR" >> "$GITHUB_ENV"
          printf 'DBUS_SESSION_BUS_ADDRESS=%s\n' "$DBUS_SESSION_BUS_ADDRESS" >> "$GITHUB_ENV"
          test "$(stat -fc %T /sys/fs/cgroup)" = cgroup2fs
          node --input-type=module -e "await (await import('./apps/worker/dist/agent-engines/native-systemd-supervisor.js')).assertSystemdUserAvailable()"
          systemd-run --user --quiet --pipe --wait --collect --service-type=exec --expand-environment=no /usr/bin/env -i /bin/true
      - run: npm run lint
      - run: npm test
      - run: npm run package
      - run: npm run test:package
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: computer-linux-x64
          path: dist/computer/
          retention-days: 7
          if-no-files-found: error
